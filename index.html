<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142420">
<title>Juragan Kost · Bangun & Kelola</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;font-family:Geist,system-ui,sans-serif;background:#172722;color:#f8f4e7}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden}
button,a{font:inherit}
button{touch-action:manipulation;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffd575;outline-offset:3px}
button:disabled{cursor:default;opacity:.55}
#world{height:100%;position:relative;isolation:isolate;background:#95a9ae}
canvas{display:block;width:100%;height:100%;touch-action:none}
#world canvas{position:absolute;inset:0}
.header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(16px,env(safe-area-inset-top)) clamp(12px,3vw,30px) 12px;background:linear-gradient(#111f1de6,transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:40px;height:40px;background:#f4bd65;color:#29231b;border-radius:12px;font-weight:800}
.brand h1{font-size:18px;margin:0;letter-spacing:-.03em}
.brand p{font-size:11px;margin:2px 0 0;color:#e0e5d9}
.stats{display:flex;gap:7px;text-align:right}
.stat{border:1px solid #e5ead43b;border-radius:12px;background:#152622e8;padding:7px 11px;min-width:73px}
.stat span{display:block;color:#c6d3c6;font-size:10px}.stat b{font-size:14px;white-space:nowrap}
#cash{color:#ffcc76}
#goal{position:absolute;top:90px;left:clamp(12px,3vw,30px);max-width:265px;padding:12px 14px;background:#172622e8;border:1px solid #f0f1d232;border-radius:13px;box-shadow:0 7px 20px #10221942;font-size:13px}
#goal b{display:block;color:#ffc773;font-size:11px;margin-bottom:4px}
.game-link{position:absolute;right:clamp(12px,3vw,30px);top:90px;color:#f9f3e4;background:#182a25ed;border:1px solid #d0dac047;border-radius:10px;padding:8px 11px;text-decoration:none;font-size:12px}
#notice{position:absolute;left:50%;top:153px;transform:translateX(-50%);max-width:85%;padding:9px 14px;background:#f2dcaa;color:#282518;border-radius:10px;font-size:13px;text-align:center;pointer-events:none}
#notice:empty{display:none}
#markers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.marker{position:absolute;transform:translate(-50%,-100%);border:1px solid #ffffffe0;padding:5px 8px;border-radius:7px;pointer-events:auto;white-space:nowrap;color:#fff;background:#1f3c32ee;font-size:11px;font-weight:800;box-shadow:0 3px 8px #17231fa6}
.marker[aria-pressed="true"]{background:#ffd17c;color:#342719}
#panel{position:absolute;right:clamp(12px,3vw,30px);bottom:max(18px,env(safe-area-inset-bottom));background:#152622f5;border:1px solid #d7dfbc57;border-radius:16px;width:min(320px,calc(100vw - 145px));padding:12px;box-shadow:0 12px 24px #14242450}
#panel h2{margin:0;font-size:16px}
#panel p{margin:5px 0 10px;color:#cbd7ca;font-size:12px}
#action{width:100%;border:0;border-radius:10px;background:#f8c36c;color:#282419;font-weight:800;padding:9px 6px;font-size:12px;min-height:38px}
.controls{position:absolute;left:clamp(12px,3vw,30px);bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,38px);gap:4px;touch-action:none;user-select:none}
.controls button{min-height:36px;border:1px solid #f2f3db70;background:#20352fee;color:white;border-radius:8px;font-weight:800;touch-action:none}
.controls button:active{background:#be813d}
.controls span{grid-column:1/-1;font-size:10px;text-align:center;text-shadow:0 1px 2px #102620}
@media(max-width:560px){.header{gap:4px}.logo{width:32px;height:32px;font-size:12px}.brand{gap:5px}.brand h1{font-size:14px}.brand p{display:none}.stats{gap:3px}.stat{padding:5px;min-width:48px}.stat b{font-size:11px}.stat span{font-size:9px}#goal{top:68px;max-width:58%;padding:8px 10px;font-size:11px}.game-link{top:68px;font-size:10px;padding:6px 8px}#notice{top:139px}.controls{grid-template-columns:repeat(3,34px)}.controls button{min-height:34px}}
</style>
</head>
<body>
<main id="world" aria-label="Lingkungan kos 3D">
  <div id="markers" aria-label="Titik interaksi 3D"></div>
  <header class="header">
    <div class="brand"><div class="logo" aria-hidden="true">JK</div><div><h1>Juragan Kost</h1><p>Bangun &amp; Kelola</p></div></div>
    <div class="stats"><div class="stat"><span>Saldo</span><b id="cash">—</b></div><div class="stat"><span>Terisi</span><b id="occupancy">—</b></div><div class="stat"><span>Sewa ditahan</span><b id="rent">—</b></div></div>
  </header>
  <div id="goal"><b>TARGET</b><span id="objective">Bangun kamar pertama.</span></div>
  <a class="game-link" href="klasik.html">Versi klasik</a>
  <div id="notice" role="status"></div>
  <div class="controls" role="group" aria-label="Gerakkan karakter">
    <i></i><button data-move="up" aria-label="Maju">▲</button><i></i>
    <button data-move="left" aria-label="Kiri">◀</button><button data-move="down" aria-label="Mundur">▼</button><button data-move="right" aria-label="Kanan">▶</button>
    <span>WASD atau panah</span>
  </div>
  <section id="panel" aria-label="Interaksi">
    <h2 id="targetName">Jelajahi kos</h2>
    <p id="targetInfo">Ketuk penanda atau bergerak ke petak.</p>
    <button type="button" id="action" disabled>Belum ada tujuan</button>
  </section>
</main>
<script src="three-r160.min.js"></script>
<script src="kos-tycoon-live.js"></script>
</body>
</html>
